<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TryHackMe Room Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div>
        <h1 class="app-title">TryHackMe Room Tracker</h1>
        <p class="app-sub">Track the rooms you want to finish — saved locally to <code>rooms.db</code>.</p>
      </div>
      <div class="header-actions">
        <button class="btn" id="btn-export" title="Download a JSON backup of all rooms">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          Export
        </button>
        <button class="btn" id="btn-import" title="Restore rooms from a JSON backup (replaces all data)">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>
          Import
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="metrics" id="metrics"></div>

    <div class="progress-section">
      <div class="section-header">
        <span class="section-title">Overall progress</span>
        <span id="pct-label" class="muted-sm"></span>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
    </div>

    <div class="chart-wrap">
      <canvas id="myChart" role="img" aria-label="Monthly room completion chart">Monthly room completions</canvas>
    </div>

    <div class="section-header" style="margin-top:1.5rem;">
      <span class="section-title">Add a room</span>
    </div>
    <div class="add-form">
      <div><label>Room name</label><input type="text" id="inp-name" placeholder="e.g. Linux Fundamentals" /></div>
      <div><label>Room URL</label><input type="text" id="inp-url" placeholder="https://tryhackme.com/room/…" /><span id="url-hint" class="url-hint" aria-live="polite"></span></div>
      <div><label>Category</label>
        <select id="inp-cat">
          <option>Fundamentals</option><option>Web</option><option>Network</option>
          <option>Crypto</option><option>Forensics</option><option>Malware</option>
          <option>Red Team</option><option>Blue Team</option><option>CTF</option><option>Other</option>
        </select>
      </div>
      <div><label>Difficulty</label>
        <select id="inp-diff"><option>Easy</option><option>Medium</option><option>Hard</option></select>
      </div>
      <div><label>Deadline</label><input type="date" id="inp-deadline" /></div>
      <div><label>Tags (comma-separated)</label><input type="text" id="inp-tags" placeholder="privesc, OSCP-prep" /></div>
      <div><button class="btn btn-primary" id="btn-add">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add
      </button></div>
    </div>

    <div class="section-header">
      <span class="section-title">Rooms</span>
      <span id="room-count" class="muted-sm"></span>
    </div>
    <div class="toolbar">
      <div class="filter-row" id="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="To Do">To Do</button>
        <button class="filter-btn" data-filter="In Progress">In Progress</button>
        <button class="filter-btn" data-filter="Done">Done</button>
        <button class="filter-btn" data-filter="Overdue">Overdue</button>
      </div>
      <input type="text" id="search" class="search" placeholder="Search name, tags, category…" />
    </div>

    <table id="room-table">
      <thead>
        <tr>
          <th style="width:32px"></th>
          <th>Room</th>
          <th>Category</th>
          <th>Difficulty</th>
          <th>Tags</th>
          <th>Deadline</th>
          <th>Completed</th>
          <th>Status</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="room-tbody"></tbody>
    </table>
    <p id="empty-state" class="empty-state" hidden>No rooms match. Add one above or clear the filter/search.</p>
  </div>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
